# Daily snapshot of the ESSE3 exam board, for servers that cannot read it.
#
# The production VPS gets a Cloudflare challenge from studenti.unifi.it
# (datacenter IP); UniFI's IT confirmed in writing that working around this
# is fine. GitHub's runners are not challenged, so this job reads the board
# and publishes it as esse3-medicina.json on the `esse3-data` branch (one
# commit, replaced each time). The server imports it with deploy/esse3-sync.sh.
name: esse3-snapshot

on:
  schedule:
    - cron: "41 4 * * *"      # daily, 04:41 UTC (06:41 in Italy in summer, 05:41 in winter)
  workflow_dispatch: {}        # "Run workflow" button for an immediate refresh

permissions:
  contents: write

concurrency:
  group: esse3-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Read the exam board
        working-directory: backend
        env:
          OPENUNIFI_DATA_DIR: ${{ runner.temp }}/data
        run: python -m app.cli fetch-exams "$RUNNER_TEMP/esse3-medicina.json"

      - name: Publish to the esse3-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/publish"
          mkdir -p "$out" && cp "$RUNNER_TEMP/esse3-medicina.json" "$out/"
          cd "$out"
          git init -q -b esse3-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esse3-medicina.json
          git commit -q -m "ESSE3 snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" esse3-data
          echo "Published $(python3 -c 'import json;print(len(json.load(open("esse3-medicina.json"))["sessions"]))') sessions"
